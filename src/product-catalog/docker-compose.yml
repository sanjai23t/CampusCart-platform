
services:
  product-catalog:
    build: .
    container_name: campuscart-product-catalog
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://campuscart_user:campuscart_dev123@postgres:5432/campuscart_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: campuscart-postgres
    environment:
      POSTGRES_USER: campuscart_user
      POSTGRES_PASSWORD: campuscart_dev123
      POSTGRES_DB: campuscart_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuscart_user -d campuscart_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: campuscart-postgres-data
